name: Repair config proof

on:
  workflow_dispatch:
    inputs:
      lease_id:
        description: "Exact task-owned AWS lease recorded by the controller"
        required: true
        type: string
      source_head:
        description: "Exact signed proof head checked immediately before dispatch"
        required: true
        type: string
      runner_name:
        description: "Exact task runner name checked immediately before dispatch"
        required: true
        type: string
      source_tree:
        description: "Reviewed proof-branch tree qualified natively on this guest"
        required: true
        type: string
      source_digest:
        description: "Controller's full tracked-source manifest SHA-256"
        required: true
        type: string
      qualification_digest:
        description: "SHA-256 of the successful pre-registration qualification receipt"
        required: true
        type: string
      matrix_input_digest:
        description: "SHA-256 of the sealed baseline/candidate source and tool inputs"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: repair-config-proof-20261001
  cancel-in-progress: false

jobs:
  repair-config-matrix:
    if: >-
      github.repository == 'openclaw/clawsweeper' &&
      github.ref == 'refs/heads/proof/repair-codex-config-20261001' &&
      github.sha == inputs.source_head &&
      github.event_name == 'workflow_dispatch'
    runs-on: crabbox-proof-20261001-b-7c91e5a2
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          # The verifier fails closed if the frozen base is outside this bound.
          fetch-depth: 11
          fetch-tags: false
          persist-credentials: false
      # The native Crabbox phase must finish before this runner is registered.
      # This step does not install tools, create a UID, set sysctls, or rerun probes.
      - name: Verify pre-registration guest qualification
        env:
          REPAIR_PROOF_RUNNER_NAME: ${{ inputs.runner_name }}
          REPAIR_PROOF_LEASE_ID: ${{ inputs.lease_id }}
          REPAIR_PROOF_SOURCE_TREE: ${{ inputs.source_tree }}
          REPAIR_PROOF_SOURCE_DIGEST: ${{ inputs.source_digest }}
          REPAIR_PROOF_QUALIFICATION_DIGEST: ${{ inputs.qualification_digest }}
        run: |
          test "$RUNNER_NAME" = "$REPAIR_PROOF_RUNNER_NAME"
          node scripts/e2e/repair-config-guest-qualification.mjs verify \
            --lease-id "$REPAIR_PROOF_LEASE_ID" \
            --source-head "$GITHUB_SHA" \
            --source-tree "$REPAIR_PROOF_SOURCE_TREE" \
            --source-digest "$REPAIR_PROOF_SOURCE_DIGEST" \
            --receipt-sha256 "$REPAIR_PROOF_QUALIFICATION_DIGEST"
      - name: Verify sealed matrix inputs and remaining lease lifetime
        env:
          REPAIR_PROOF_MATRIX_INPUT_DIGEST: ${{ inputs.matrix_input_digest }}
        run: node scripts/e2e/repair-config-matrix.mjs verify-stage "$REPAIR_PROOF_MATRIX_INPUT_DIGEST"
      - name: Native API login for the isolated proof UID
        env:
          REPAIR_PROOF_MATRIX_INPUT_DIGEST: ${{ inputs.matrix_input_digest }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLAWSWEEPER_INTERNAL_MODEL: ${{ secrets.CLAWSWEEPER_MODEL }}
        run: node scripts/e2e/repair-config-matrix.mjs login "$REPAIR_PROOF_MATRIX_INPUT_DIGEST"
      # Credentials are absent from this step's environment. Native exec uses only
      # the proof UID's fresh login, never the runner's Actions/GitHub environment.
      - name: Run four-cell compiled repair matrix
        env:
          REPAIR_PROOF_MATRIX_INPUT_DIGEST: ${{ inputs.matrix_input_digest }}
        run: node scripts/e2e/repair-config-matrix.mjs run-matrix "$REPAIR_PROOF_MATRIX_INPUT_DIGEST"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: repair-config-proof
          path: |
            /opt/repair-config-proof-20261001/qualification.json
            /opt/repair-config-proof-20261001/matrix-result.json
          if-no-files-found: error
          retention-days: 7
